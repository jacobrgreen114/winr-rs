[package]
name = "winr"
description = "A cross-platform windowing framework."
version = "0.0.1"
authors = ["Jacob Green"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jacobrgreen114/winr-rs"
edition = "2024"
categories = ["gui"]

[dependencies]
thiserror = { version = "2.0" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse"] }